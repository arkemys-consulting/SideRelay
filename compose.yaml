services:
  siderelay:
    image: siderelay:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIDERELAY_PORT:-18785}:8080"
    volumes:
      - siderelay_data:/var/lib/siderelay
      - siderelay_secrets:/var/lib/siderelay-secrets
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true

volumes:
  siderelay_data:
  siderelay_secrets:
